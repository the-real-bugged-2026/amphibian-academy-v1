<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="Stylesheet" id="background" href="profile.css" />
</head>
<body>
    <h1 class="title">Customize Frog</h1>
    <script src="script.js"></script>

    <!-- <div class="sections">
        <h2 class="Items"></h2>
    </div> -->

    <div id="layout">
        <!-- Draggable items -->
        <div id="items">
            <div class="items" draggable="true" data-item="frog1">1</div>
            <div class="items" draggable="true" data-item="frog2">2</div>
            <div class="items" draggable="true" data-item="frog3">3</div>
            <div class="items" draggable="true" data-item="frog4">4</div>
            <div class="items" draggable="true" data-item="frog5">5</div>
            <div class="items" draggable="true" data-item="frog6">6</div>
            <div class="items" draggable="true" data-item="frog7">7</div>
            <div class="items" draggable="true" data-item="frog8">8</div>
        </div>

        <!-- Right: Sprite character -->
        <div id="frog_sprite">
            <div class="layer" id ="frog1">frog1 equipped</div>
            <div class="layer" id ="frog2">frog2 equipped</div>
            <div class="layer" id ="frog3">frog3 equipped</div>
            <div class="layer" id ="frog4">frog4 equipped</div>
        </div>
     </div>
</body>
</html>
