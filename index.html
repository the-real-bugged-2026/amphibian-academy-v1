<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amphibian Academy - Auth</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="home_auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body class="auth-locked">
  <header class="home-topbar">
    <h1 class="title">Amphibian Academy</h1>
    <div class="auth-user-row">
      <span id="authUserEmail" class="auth-user-email hidden" aria-live="polite"></span>
      <button id="logoutBtn" class="auth-logout hidden" type="button">Log Out</button>
    </div>
  </header>

  <div class="subjects">
    <h2 class="subjects_text">Subjects</h2>
    <a href="math.html">
      <button class="math">Math</button>
    </a>
    <button class="history" type="button">History</button>
    <button class="science" type="button">Science</button>
  </div>

  <div class="recent_games">
    <h2 class="recent_text">Recently Played</h2>
    <button class="recent_game" type="button">Recent Game</button>
    <button class="recent_game" type="button">Recent Game</button>
  </div>

  <footer>hai we r the devs :3</footer>

  <div id="authOverlay" class="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-card">
      <p class="auth-kicker">Main Home Access</p>
      <h2 id="authTitle">Login To Enter</h2>
      <p class="auth-subtext">Use Firebase Authentication with Email/Password.</p>

      <div class="auth-mode-row" role="tablist" aria-label="Authentication mode">
        <button id="modeLoginBtn" class="auth-mode-btn active" type="button" role="tab" aria-selected="true">
          Login
        </button>
        <button id="modeSignupBtn" class="auth-mode-btn" type="button" role="tab" aria-selected="false">
          Create Account
        </button>
      </div>

      <form id="authForm" class="auth-form" novalidate>
        <label for="authEmail">Email</label>
        <input
          id="authEmail"
          class="auth-input"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="frog@example.com"
          required
        >

        <label for="authPassword">Password</label>
        <input
          id="authPassword"
          class="auth-input"
          type="password"
          minlength="6"
          autocomplete="current-password"
          placeholder="At least 6 characters"
          required
        >

        <p id="authStatus" class="auth-status" aria-live="polite"></p>
        <button id="authSubmitBtn" class="auth-submit" type="submit">Login</button>
      </form>
    </div>
  </div>

  <script type="module" src="home_auth.js"></script>
</body>
</html>
